services:
  # Banco de origem (extração)
  db:
    image: postgres:12
    container_name: db
    environment:
      POSTGRES_DB: northwind
      POSTGRES_USER: northwind_user
      POSTGRES_PASSWORD: thewindisblowing
    ports:
      - "15432:5432"
    volumes:
      - ./data/northwind.sql:/docker-entrypoint-initdb.d/northwind.sql
      - postgres_data:/var/lib/postgresql/data

  # Extração do CSV via Meltano
  01_extract_csv_meltano:
    build: ./01_extract_csv_meltano
    container_name: 01_extract_csv_meltano
    volumes:
      - ./data:/data
      - ./01_extract_csv_meltano:/app
    env_file:
      - .env
    depends_on:
      - db
    entrypoint: [ "sh", "-c", "while true; do sleep 3600; done" ]

  # Extração do banco via Embulk
  02_extract_postgres_embulk:
    build: ./02_extract_postgres_embulk
    container_name: 02_extract_postgres_embulk
    volumes:
      - ./data:/data
      - ./02_extract_postgres_embulk:/app
    env_file:
      - .env
    depends_on:
      - db
    entrypoint: [ "sh", "-c", "while true; do sleep 3600; done" ]

  # Provisionamento de infraestrutura no Databricks via Terraform
  03_infra_provision_terraform:
    build: ./03_infra_provision_terraform
    container_name: 03_infra_provision_terraform
    volumes:
      - ./03_infra_provision_terraform:/infra
      - ./.env:/infra/.env
    entrypoint: [ "sh", "-c", "while true; do sleep 3600; done" ]

  # Carga para o Databricks (upload + execução de job)
  04_load_to_databricks:
    build: ./04_load_to_databricks
    container_name: 04_load_to_databricks
    volumes:
      - ./data:/data
      - ./04_load_to_databricks:/app
      - ./.env:/app/.env         # ✅ Corrigido aqui
    env_file:
      - .env
    entrypoint: [ "sh", "-c", "while true; do sleep 3600; done" ]

  # Orquestração com Airflow
  orchestrate-airflow:
    build: ./orchestrate-airflow
    container_name: orchestrate-airflow
    user: root
    ports:
      - "8080:8080"
    volumes:
      - ./orchestrate-airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./Makefile:/opt/airflow/Makefile
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com &&
        exec airflow standalone
      "

volumes:
  postgres_data: