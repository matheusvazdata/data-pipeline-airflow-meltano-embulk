version: 2

sources:
  - name: 00_raw
    description: Camada bruta com os dados extraídos de diferentes fontes (PostgreSQL e CSV).
    database: "{{ env_var('DATABRICKS_CATALOG') }}"
    schema: "{{ env_var('DATABRICKS_SCHEMA') }}"
    tables:

      - name: categories
        description: Tabela de categorias de produtos.
        columns:
          - name: category_id
            description: Identificador da categoria.
          - name: category_name
            description: Nome da categoria.
          - name: description
            description: Descrição da categoria.

      - name: customer_customer_demo
        description: Relacionamento N:N entre clientes e seus tipos demográficos.
        columns:
          - name: customer_id
            description: Identificador do cliente.
          - name: customer_type_id
            description: Tipo demográfico associado ao cliente.

      - name: customer_demographics
        description: Tipos demográficos atribuíveis a clientes.
        columns:
          - name: customer_type_id
            description: Identificador do tipo de cliente.
          - name: customer_desc
            description: Descrição do tipo de cliente.

      - name: customers
        description: Tabela contendo dados cadastrais de clientes.
        columns:
          - name: customer_id
            description: Identificador do cliente.
          - name: company_name
            description: Nome da empresa cliente.
          - name: contact_name
            description: Nome da pessoa de contato.
          - name: contact_title
            description: Cargo da pessoa de contato.
          - name: address
            description: Endereço completo.
          - name: city
            description: Cidade.
          - name: region
            description: Região.
          - name: postal_code
            description: Código postal.
          - name: country
            description: País.
          - name: phone
            description: Telefone.
          - name: fax
            description: Fax.

      - name: employees
        description: Tabela com os dados dos funcionários da empresa.
        columns:
          - name: employee_id
            description: Identificador único do funcionário.
          - name: first_name
            description: Primeiro nome.
          - name: last_name
            description: Sobrenome.
          - name: title
            description: Cargo ou título do funcionário.
          - name: birth_date
            description: Data de nascimento.

      - name: employee_territories
        description: Relacionamento entre funcionários e territórios de atuação.
        columns:
          - name: employee_id
            description: Chave estrangeira para a tabela de funcionários.
          - name: territory_id
            description: Identificador do território.

      - name: order_details
        description: Detalhes das linhas de pedido, originados de fonte CSV externa.
        columns:
          - name: order_id
            description: Identificador do pedido.
          - name: product_id
            description: Identificador do produto.
          - name: unit_price
            description: Preço unitário do produto.
          - name: quantity
            description: Quantidade pedida.
          - name: discount
            description: Porcentagem de desconto aplicada.

      - name: orders
        description: Tabela com os pedidos realizados pelos clientes.
        columns:
          - name: order_id
            description: Identificador do pedido.
          - name: customer_id
            description: Cliente que realizou o pedido.
          - name: employee_id
            description: Funcionário responsável pelo pedido.
          - name: order_date
            description: Data do pedido.
          - name: required_date
            description: Data solicitada para entrega.
          - name: shipped_date
            description: Data de envio.
          - name: ship_via
            description: Transportadora utilizada.
          - name: freight
            description: Custo do frete.
          - name: ship_name
            description: Nome do destinatário.
          - name: ship_address
            description: Endereço de entrega.
          - name: ship_city
            description: Cidade de entrega.
          - name: ship_region
            description: Região de entrega.
          - name: ship_postal_code
            description: Código postal de entrega.
          - name: ship_country
            description: País de entrega.

      - name: products
        description: Tabela com o catálogo de produtos comercializados.
        columns:
          - name: product_id
            description: Identificador único do produto.
          - name: product_name
            description: Nome do produto.
          - name: supplier_id
            description: Fornecedor do produto.
          - name: category_id
            description: Categoria a que o produto pertence.
          - name: quantity_per_unit
            description: > 
              Descrição da unidade de venda (ex: "10 boxes x 30 bags").
          - name: unit_price
            description: Preço unitário.
          - name: units_in_stock
            description: Quantidade disponível em estoque.
          - name: units_on_order
            description: Quantidade já encomendada.
          - name: reorder_level
            description: Nível de estoque que dispara reposição.
          - name: discontinued
            description: Indica se o produto foi descontinuado (1) ou não (0).

      - name: region
        description: Tabela com as regiões geográficas utilizadas nos territórios.
        columns:
          - name: region_id
            description: Identificador único da região.
          - name: region_description
            description: Nome ou descrição da região.

      - name: shippers
        description: Transportadoras disponíveis para entrega dos pedidos.
        columns:
          - name: shipper_id
            description: Identificador da transportadora.
          - name: company_name
            description: Nome da transportadora.
          - name: phone
            description: Telefone de contato.

      - name: suppliers
        description: Fornecedores dos produtos disponíveis no catálogo.
        columns:
          - name: supplier_id
            description: Identificador do fornecedor.
          - name: company_name
            description: Nome da empresa fornecedora.
          - name: contact_name
            description: Nome da pessoa de contato.
          - name: contact_title
            description: Cargo da pessoa de contato.
          - name: address
            description: Endereço completo do fornecedor.
          - name: city
            description: Cidade.
          - name: region
            description: Região.
          - name: postal_code
            description: Código postal.
          - name: country
            description: País.
          - name: phone
            description: Telefone.
          - name: fax
            description: Fax.
          - name: homepage
            description: Página inicial ou observação da empresa.

      - name: territories
        description: Tabela com os territórios comerciais e suas regiões associadas.
        columns:
          - name: territory_id
            description: Identificador do território.
          - name: territory_description
            description: Descrição do território.
          - name: region_id
            description: Identificador da região associada.

      - name: us_states
        description: Tabela de estados dos EUA usada para referência regional no sistema.
        columns:
          - name: state_id
            description: Identificador do estado.
          - name: state_name
            description: Nome do estado.
          - name: state_abbr
            description: Abreviação oficial do estado (2 letras).
          - name: state_region
            description: Região geográfica dos EUA à qual o estado pertence.