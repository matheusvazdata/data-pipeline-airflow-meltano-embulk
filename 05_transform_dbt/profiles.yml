northwind:
  target: "{{ env_var('DBT_DEFAULT_PROFILE_TARGET', 'dev') }}"
  outputs:
    dev:
      type: databricks
      method: http
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') | trim }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') | string }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA') }}"
      threads: 4
      connect_timeout: 60
      http_timeout: 300
      retry_all: true